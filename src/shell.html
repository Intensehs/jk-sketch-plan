<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>JK Sketch Plan</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16365c">
<script>/* Theme: apply the saved theme before first paint (no flash) */try{if(JSON.parse(localStorage.getItem("jksp_theme")||"null")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:Roboto,"Noto Sans","Noto Sans Tamil",Arial,sans-serif;color:#172b45;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "ctx" "stage" "tools"}
#top{grid-area:top;min-width:0;display:flex;align-items:center;gap:4px;padding:4px 6px;background:#16365c;color:#fff;min-height:54px}
#brand{flex:1;min-width:0;line-height:1.1}
#brand b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brand small{font-size:10.5px;opacity:.8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brand i{font-style:normal;font-size:11px;color:#ffd58a;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{background:transparent;border:0;color:#fff;width:46px;height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-size:9.5px;gap:1px;cursor:pointer}
.tb svg{width:24px;height:24px}
.tb:active{background:rgba(255,255,255,.18)}
.tb.on{background:#ffd58a;color:#16365c}
.tb:disabled{opacity:.35}
#ctx{grid-area:ctx;min-width:0;display:flex;gap:6px;padding:6px;background:#eef3f9;border-bottom:1px solid #d5deea;overflow-x:auto;scrollbar-width:none}
#ctx::-webkit-scrollbar{display:none}
.cb{flex:0 0 auto;border:1.5px solid #9fb3cc;background:#fff;color:#16365c;border-radius:10px;min-height:44px;padding:4px 10px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;cursor:pointer}
.cb small{font-size:10px;font-weight:400;opacity:.75}
.cb.on{background:#16365c;color:#fff;border-color:#16365c}
.cb.warn{border-color:#c0392b;color:#c0392b}
#stage{grid-area:stage;position:relative;overflow:hidden;background:#fff}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#e8590c;color:#fff;font-weight:700;font-size:26px;padding:4px 16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none;display:none;white-space:nowrap}
#info{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.92);border:1px solid #d5deea;border-radius:10px;padding:4px 10px;font-size:13px;pointer-events:none;max-width:70%}
#hint{position:absolute;left:8px;bottom:42px;text-align:left;background:rgba(22,54,92,.88);color:#fff;border-radius:10px;padding:4px 10px;font-size:12px;pointer-events:none;max-width:80%}
#tools{grid-area:tools;min-width:0;display:flex;justify-content:space-around;gap:2px;padding:4px 2px calc(4px + env(safe-area-inset-bottom));background:#16365c}
.tool{flex:1 1 0;max-width:96px;min-width:0;background:transparent;border:0;color:#fff;border-radius:12px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:600;cursor:pointer;padding:0}
.tool svg{width:28px;height:28px}
.tool small{font-size:9.5px;font-weight:400;opacity:.85}
.tool.on{background:#ffd58a;color:#16365c}
/* TABLET BUILD: left tool rail always, max canvas */
#app{grid-template-columns:108px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top" "tools ctx" "tools stage"}
#top{min-height:50px;padding:2px 8px}
#tools{flex-direction:column;justify-content:flex-start;padding:8px 6px calc(8px + env(safe-area-inset-bottom));gap:6px;overflow-y:auto}
.tool{flex:0 0 auto;max-width:none;width:100%;height:62px;min-height:60px;font-size:14px;border-radius:14px}
.tool svg{width:30px;height:30px}
.tool small{font-size:11px}
.tb{width:64px;height:48px;font-size:11px}
.tb svg{width:26px;height:26px}
#brand b{font-size:20px;display:inline}
#brand small{font-size:12.5px;display:inline;margin-left:10px}
#brand i{font-size:12.5px}
#ctx{padding:5px 8px;gap:8px}
.cb{min-height:52px;min-width:72px;font-size:15px;padding:4px 14px}
.cb small{font-size:11px}
#hud{font-size:34px;padding:4px 20px;top:12px}
#info{font-size:15px}
#hint{font-size:13.5px}
.mbox{max-width:600px}

.kp button{min-height:56px}
#modal{position:fixed;inset:0;background:rgba(10,25,45,.45);display:none;align-items:center;justify-content:center;z-index:20}
#modal.show{display:flex}
@media (min-width:600px){#modal{align-items:center}}
.mbox{background:#fff;width:100%;max-width:480px;max-height:96vh;overflow:auto;border-radius:18px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.25)}
@media (min-width:600px){.mbox{border-radius:18px}}
.mt{font-size:19px;font-weight:700;margin:0 0 4px}
.ms{font-size:13px;color:#4a5d75;margin:0 0 10px}
.row{display:flex;gap:8px;margin:8px 0}
.row>*{flex:1}
.bb{border:0;border-radius:12px;min-height:54px;font-size:17px;font-weight:700;background:#e6edf6;color:#16365c;cursor:pointer;padding:6px 8px;line-height:1.15}
.bb small{display:block;font-size:11px;font-weight:400;opacity:.8}
.bb.pri{background:#16365c;color:#fff}
.bb.ok{background:#1c7c43;color:#fff}
.bb.del{background:#fde3e0;color:#a52a1d}
.bb.on{background:#ffd58a;color:#16365c;outline:2px solid #16365c}
.lenf{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 10px;font-size:20px;font-weight:600}
.lf{min-width:96px;text-align:center;font-size:38px;font-weight:700;border:2.5px solid #b8c6d8;border-radius:12px;padding:2px 10px;background:#f7f9fc;color:#16365c;cursor:pointer}
.lf.on{border-color:#e8590c;background:#fff4ec}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{min-height:58px;font-size:26px;font-weight:700;border:0;border-radius:12px;background:#eef3f9;color:#16365c;cursor:pointer}
.kp button:active,.bb:active,.cb:active,.tool:active{filter:brightness(.88)}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld{display:block;margin:8px 0;font-size:13px;color:#4a5d75}
.fld input,.fld select{display:block;width:100%;margin-top:3px;font-size:18px;padding:10px;border:1.5px solid #b8c6d8;border-radius:10px;color:#172b45;background:#fff;-webkit-user-select:text;user-select:text}
.file{display:flex;align-items:center;gap:8px;border:1px solid #d5deea;border-radius:12px;padding:8px;margin:6px 0}
.file div{flex:1;min-width:0}
.file b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file small{color:#4a5d75}
.file button{min-height:44px;min-width:56px;font-size:14px}
/* v1.3 ribbon tabs + properties */
#app{grid-template-columns:100px minmax(0,1fr) auto;grid-template-areas:"top top top" "tools ctx ctx" "tools stage props"}
#tabs{display:flex;gap:2px;align-self:flex-end;margin-bottom:-2px}
.tab{background:transparent;border:0;color:#dbe6f3;font-size:14.5px;font-weight:700;padding:9px 13px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}
.tab.on{background:#eef3f9;color:#16365c}
#brand{flex:1 1 120px}
@media (max-width:1250px){#brand small{display:none}}
@media (max-width:1100px){.tab{padding:9px 8px;font-size:13px}#brand b{font-size:16px}.tb{width:52px}}
#lvBadge{display:inline-block;background:#ffd58a;color:#16365c;border-radius:8px;padding:0 8px;margin-left:6px;font-weight:700;font-size:12px}
#tools .tool{height:56px;min-height:54px;font-size:13px;border-radius:12px;gap:0}
#tools .tool svg{width:26px;height:26px}
#tools .tool small{font-size:10px}
#tools .tool.act{background:rgba(255,255,255,.08)}
#props{grid-area:props;width:288px;display:none;background:#f7f9fc;border-left:1px solid #d5deea;overflow-y:auto;padding:8px 10px;font-size:14px}
#app.pr #props{display:block}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.ph b{font-size:17px}.ph .cb{min-height:36px;min-width:40px;padding:2px 8px}
.pt{background:#16365c;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;margin:4px 0 8px}
.pf{display:grid;grid-template-columns:44% 56%;align-items:center;border-bottom:1px solid #e3e9f1;padding:4px 0}.pf label{font-size:12.5px;color:#4a5d75}
.pf input,.pf select{font-size:15px;padding:6px 6px;border:1.5px solid #b8c6d8;border-radius:8px;width:100%;background:#fff;color:#172b45;-webkit-user-select:text;user-select:text}
.pf .ro{font-weight:600;color:#172b45;font-size:14px;padding:6px 4px}
.pn{font-size:12.5px;color:#4a5d75;margin:10px 2px}
.cnt{align-self:center;font-weight:700;color:#0e7490;white-space:nowrap;padding:0 4px}
.cb.lvb{background:#fff6e0;border-color:#e0a83a}
.cb.ok2{border-color:#1c7c43;color:#1c7c43}
#toast{pointer-events:none;position:fixed;left:calc(50% + 54px);top:120px;transform:translateX(-50%);background:#172b45;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:30;display:none;max-width:90%;text-align:center}
.warn{color:#b03a2e}

/* ---------- 3D overlay ---------- */
#v3d{position:fixed;inset:0;z-index:15;display:none;grid-template-columns:108px minmax(0,1fr);grid-template-rows:50px minmax(0,1fr) auto;grid-template-areas:"v3top v3top" "v3rail v3stage" "v3rail v3cmd";background:#cfe2f3}
#v3d.show{display:grid}
#v3top{grid-area:v3top;display:flex;align-items:center;gap:8px;padding:0 10px;background:#16365c;color:#fff}
#v3title{flex:1;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#v3rail{grid-area:v3rail;background:#16365c;display:flex;flex-direction:column;gap:6px;padding:8px 6px;overflow-y:auto}
#v3rail .tool{height:66px;min-height:64px}
#v3rail .tool span{font-size:13px}
#v3stage{grid-area:v3stage;position:relative;overflow:hidden}
#cv3{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#v3hint{position:absolute;left:10px;top:10px;background:rgba(22,54,92,.85);color:#fff;border-radius:10px;padding:5px 12px;font-size:14px;pointer-events:none}
#vcube,#vstyle{display:none}
#v3d.cad #vcube{display:grid;position:absolute;right:10px;top:10px;grid-template-columns:repeat(3,64px);gap:5px;background:rgba(40,48,58,.85);padding:8px;border-radius:12px;border:1px solid #4b5866}
#v3d.cad #vstyle{display:flex;position:absolute;left:10px;top:10px;gap:5px;background:rgba(40,48,58,.85);padding:6px;border-radius:12px;border:1px solid #4b5866}
.vc{min-height:46px;border:1px solid #6b7886;background:#2f3944;color:#dfe7ef;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;padding:2px}
.vc.top{background:#3d4a58}
.vc.on,.vs.on{background:#e8c547;color:#1d2228;border-color:#e8c547}
.vs{min-height:46px;min-width:86px;border:1px solid #6b7886;background:#2f3944;color:#dfe7ef;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
#v3cmd{grid-area:v3cmd;display:none;background:#1a1f26;color:#cfd8e2;font:13px/1.35 Consolas,"Roboto Mono",monospace;padding:4px 10px;border-top:1px solid #3a4552}
#v3d.cad #v3cmd{display:block}
#v3d.cad #v3hint{display:none}
#cmdRow{display:flex;align-items:center;gap:8px}
#cmdIn{flex:1;background:#232a33;border:1px solid #3d4855;color:#fff;font:14px Consolas,monospace;padding:6px 8px;border-radius:6px;-webkit-user-select:text;user-select:text}
#cmdXY{color:#9fd0ff;white-space:nowrap}
#v3d.cad #v3rail,#v3d.cad #v3top{background:#2a323c}
/* =================== v1.4 MODERN COMPACT UI =================== */
:root{--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--line:#e2e8f0;--bg:#f8fafc;--acc:#2563eb;--accs:#e8f0fe;--brand:#16365c;--ok:#15803d;--bad:#b91c1c;--top:36px;--rail:44px}
html,body{font-family:"Inter","Roboto","Noto Sans","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);font-feature-settings:"tnum" 1}
#app{grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr);grid-template-areas:"top top" "tools stage"}
#top{grid-area:top;min-height:0;height:var(--top);padding:0 6px 0 0;gap:0;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);align-items:stretch}
#brand{flex:0 1 auto;display:flex;align-items:center;gap:8px;min-width:0;max-width:300px;padding-left:7px;overflow:hidden}
#bmark{flex:0 0 auto;width:30px;height:24px;border-radius:6px;background:var(--brand);color:#fff;font-weight:800;font-size:11.5px;letter-spacing:.5px;display:flex;align-items:center;justify-content:center}
#btxt{min-width:0;line-height:1.1;display:flex;flex-direction:column}
#brand b{font-size:12.5px;font-weight:650;display:block;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brand small{display:none}
#brand i{font-size:11px;color:var(--ink2);font-style:normal;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvBadge{background:var(--accs);color:var(--acc);border-radius:4px;padding:0 5px;margin-left:5px;font-size:10.5px;font-weight:600}
#tabs{display:flex;gap:0;align-self:stretch;margin:0 0 0 14px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--ink2);font-size:12.5px;font-weight:550;padding:0 11px;border-radius:0;height:100%;cursor:pointer;white-space:nowrap;letter-spacing:.1px}
.tab:hover{color:var(--ink)}
.tab.on{background:transparent;color:var(--acc);border-bottom-color:var(--acc);font-weight:650}
#tbar{display:flex;align-items:center;gap:1px;flex:0 0 auto}
.tsep{width:1px;height:18px;background:var(--line);margin:0 4px}
.tb,#top .tb{width:30px;height:30px;border-radius:7px;color:var(--ink2);background:transparent;border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tb svg,#top .tb svg{width:17px;height:17px}
.tb span{display:none}
.tb:hover{background:#f1f5f9;color:var(--ink)}
.tb.on{background:var(--accs);color:var(--acc)}
.tb:disabled{opacity:.3}
/* left rail: icon-only, grouped Revit panels */
#tools{grid-area:tools;flex-direction:column;justify-content:flex-start;align-items:center;gap:1px;padding:4px 0 calc(6px + env(safe-area-inset-bottom));background:var(--bg);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools .tool,.rt{flex:0 0 auto;width:34px;height:32px;min-height:0;max-width:none;border-radius:7px;padding:0;margin:0;background:transparent;border:0;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0}
#tools .tool svg{width:17px;height:17px}
#tools .tool small{display:none}
#tools .tool:hover{background:#eef2f7;color:var(--ink)}
#tools .tool.on{background:var(--accs);color:var(--acc);box-shadow:inset 0 0 0 1px #c7d7fb}
#tools .tool.act{background:transparent}
#tools .tool.act:hover{background:#eef2f7}
.rph{width:100%;text-align:center;font-size:7.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);padding:6px 1px 2px;border-top:1px solid var(--line);margin-top:3px;line-height:1;white-space:nowrap;overflow:hidden}
.rph:first-child{border-top:0;margin-top:0;padding-top:3px}
/* option bar: overlay chips, auto-hides while drawing */
#ctx{position:absolute;z-index:6;left:calc(var(--rail) + 8px);top:calc(var(--top) + 6px);max-width:calc(100% - var(--rail) - 16px);display:flex;align-items:center;gap:4px;padding:3px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(15,23,42,.08);overflow-x:auto;transition:opacity .18s,transform .18s;backdrop-filter:blur(6px)}
#app.drawing #ctx{opacity:.0;pointer-events:none;transform:translateY(-4px)}
#app.noopt #ctx{display:none}
.cb,#ctx .cb{flex:0 0 auto;min-height:0;min-width:0;height:28px;padding:0 9px;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:7px;font-size:12px;font-weight:550;display:flex;flex-direction:row;align-items:center;gap:5px;line-height:1;white-space:nowrap;cursor:pointer}
.cb svg{width:15px;height:15px;flex:0 0 auto}
.cb small,#ctx .cb small{display:none}
.cb:hover{background:#f1f5f9}
.cb.on{background:var(--accs);color:var(--acc);border-color:#c7d7fb}
.cb.warn{color:var(--bad);border-color:transparent}
.cb.ok2{color:var(--ok);border-color:transparent}
.cb.lvb{background:#f8fafc;border-color:var(--line)}
.ctl{display:flex;align-items:center;gap:5px;padding:0 8px 0 5px;font-size:12px;font-weight:650;color:var(--ink);white-space:nowrap;border-right:1px solid var(--line);margin-right:2px;height:22px}
.ctl svg{width:15px;height:15px;color:var(--acc)}
.cdv{width:1px;height:18px;background:var(--line);flex:0 0 auto;margin:0 2px}
.cnt{font-size:12px;color:var(--acc);font-weight:650}
.tsel{height:28px;font-size:12px;font-weight:550;color:var(--ink);border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:0 6px;max-width:230px;flex:0 0 auto}
.tlab{font-size:10.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;padding-left:4px}
/* canvas overlays */
#stage{grid-area:stage}
#hud{font-size:20px;font-weight:650;padding:3px 12px;top:56px;border-radius:8px;background:#ea580c;box-shadow:0 4px 12px rgba(234,88,12,.3)}
#info{font-size:11.5px;padding:3px 8px;border-radius:7px;border-color:var(--line);color:var(--ink2);left:6px;bottom:6px;background:rgba(255,255,255,.9)}
#info b{color:var(--ink)}
#hint{font-size:11px;padding:3px 8px;border-radius:7px;bottom:32px;left:6px;background:rgba(15,23,42,.72)}
#toast{left:50%;top:auto;bottom:40px;font-size:13px;padding:7px 14px;border-radius:9px;background:rgba(15,23,42,.92)}
#tip{position:fixed;z-index:40;display:none;background:#0f172a;color:#fff;font-size:11.5px;font-weight:550;padding:4px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#tip small{display:block;font-weight:400;opacity:.7;font-size:10.5px}
/* properties: slide-over */
#props{grid-area:auto;position:absolute;z-index:8;top:var(--top);right:0;bottom:0;width:300px;display:block;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 28px rgba(15,23,42,.10);padding:8px 12px 16px;font-size:12.5px;overflow-y:auto;transform:translateX(105%);visibility:hidden;transition:transform .2s ease,visibility 0s .2s}
#app.pr #props{transform:none;visibility:visible;transition:transform .2s ease}
.ph{margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}.ph b{font-size:13.5px;font-weight:650}
.ph .cb{height:26px;width:26px;padding:0;justify-content:center}
.pt{background:transparent;color:var(--ink2);border-radius:0;padding:6px 0 4px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:6px 0 2px;border-bottom:1px solid var(--line)}
.pf{grid-template-columns:44% 56%;border-bottom:1px solid #f1f5f9;padding:3px 0;min-height:32px}
.pf label{font-size:12px;color:var(--ink2)}
.pf input,.pf select{font-size:12.5px;padding:5px 7px;border:1px solid #cbd5e1;border-radius:6px;height:28px}
.pf input:focus,.pf select:focus,.tsel:focus{outline:2px solid #bfdbfe;border-color:var(--acc)}
.pf .ro{font-size:12.5px;font-weight:550;padding:5px 2px}

.lf{font-size:32px;border-width:1.5px;border-radius:10px}

#v3d{grid-template-columns:52px minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr) auto}
#v3top{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);font-size:12px}
#v3title{font-size:13px;font-weight:650}

#v3rail .tool.on{background:var(--accs);color:var(--acc)}
#v3hint{font-size:11.5px;padding:3px 9px;border-radius:7px;background:rgba(15,23,42,.7)}
